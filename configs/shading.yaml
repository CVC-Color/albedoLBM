# LBM-SID -- shading estimation, conditioned on albedo.
# Trained on InteriorVerse + Hypersim without the reconstruction loss (alpha = 1.0).
backbone_signature: stabilityai/stable-diffusion-xl-base-1.0

# Latent bridge
timestep_sampling: custom_timesteps
selected_timesteps: [250, 500, 750, 1000]
prob: [0.25, 0.25, 0.25, 0.25]
bridge_noise_sigma: 0.005

# Architecture
unet_input_channels: 8   # 4 latent channels + 4 conditioning channels
vae_num_channels: 4
transformer_layers_per_block: [1, 2, 10]

# Batch keys
source_key: image
target_key: shading
conditioning_images_keys: ["albedo"]
conditioning_masks_keys: []

# Losses (kept for reference; unused at inference time)
latent_loss_type: l2
latent_loss_weight: 1.0
pixel_loss_type: lpips
pixel_loss_weight: 0.0
